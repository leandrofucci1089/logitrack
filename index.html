    function wav(f) {
      const r = 22050, d = [], L = r * .16;
      for (const q of f) {
        for (let i = 0; i < L; i++) d.push(Math.sin(2 * Math.PI * q * i / r) * Math.min(1, i / 200, (L - i) / 400) * 26000);
        for (let i = 0; i < r * .1; i++) d.push(0);

    async function leggiNotifiche() {

      opView(st);
    }

    setInterval(async () => {
      if (!tok || scan || document.hidden) return;
      try {
        const { data, error } = await SB.rpc('lt_stato', { p_tok: tok });
        if (error || !data) return;
        const ids = (data.notifiche || []).map(n => n.id).join();
        if (ids !== nIds) {
          if (ids) { beep(2); navigator.vibrate?.(150); }
          opView(data);
        }
      } catch (e) {}

    function alertMsg(st) {
      const td = st.storico.filter(x => dkey(x.orario) === dkey(new Date())).reverse();
      const l = td[td.length - 1];
      if (!l) return '';
      const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
      if ((l.tipo === 'ENTRATA' || l.tipo === 'FINE_PAUSA') && !td.some(x => x.tipo === 'INIZIO_PAUSA') && m >= 810) {
        return 'Sono passate le 13:30: ricordati di timbrare l\'uscita pausa.';
      }
      if (l.tipo === 'INIZIO_PAUSA' && (n - new Date(l.orario)) / 6e4 >= 60) {
        return 'La pausa è terminata (60 minuti): non dimenticare di timbrare il rientro pausa!';
      }
      return '';
    }

    setInterval(() => {
      if (!tok || !LAST || scan) return;
      const m = alertMsg(LAST);
      if (m && Date.now() - lastAl > 18e4) {
        lastAl = Date.now();
        beep(3);
        navigator.vibrate?.([200, 100, 200]);
      }
      if (m !== shown) opView(LAST);

      const ult = (LAST && LAST.storico && LAST.storico[0]) ? LAST.storico[0].tipo : '';
      if (ult === t) return false;
      return (NEXT[ult] || ['ENTRATA']).includes(t);
    }

                <div class="row" style="margin-bottom:10px">

                ? o.map(x => `<div class="row" style="margin:0;padding:8px 0;border-bottom:1px solid var(--line)"><b style="color:var(--${COL[x.tipo]})">${T[x.tipo]}</b><b style="text-align:right">${hm(x.orario)}</b></div>`).join('')

    async function opLogin() {
      beep(0);
      const r = await rpc('lt_login', { p_codice: $('#c').value, p_pin: $('#p').value });
      if (r.errore) return toast(r.errore, 1);
      tok = r.token;
      localStorage.setItem('lt_tok', tok);
      opView();
    }

    function opLogout() {
      tok = null;
      localStorage.removeItem('lt_tok');
      opView();
    }

    async function timbra(t, m, lat, lng, q) {
      if (TIMBRA_LOCK) return;
      if (!canTimbra(t)) {
        toast('Timbratura già registrata o non consentita in questa fase', 1);
        opView(LAST);
        return;
      }
      TIMBRA_LOCK = true;
      try {
        const st = await rpc('lt_timbra', { p_tok: tok, p_tipo: t, p_metodo: m, p_lat: lat, p_lng: lng, p_qr: q });
        navigator.vibrate?.(150);
        opView(st);
        conferma(t, st.nome);
      } finally {
        TIMBRA_LOCK = false;
      }
    }

    function conferma(t, nome) {
      beep(2);
      const c = 'var(--' + COL[t] + ')', o = $('#ov');
      o.innerHTML = `<div class="b" style="border-color:${c}"><div style="font-size:48px;color:${c}">✓</div><h2 style="margin:6px 0">${T[t].toUpperCase()} REGISTRATA</h2><div class="mu">${esc(nome)}</div><div class="big" style="color:${c}">${hm(new Date())}</div><button style="margin-top:8px">OK</button></div>`;
      o.style.display = 'flex';
      clearTimeout(conferma.t);
      conferma.t = setTimeout(() => o.style.display = 'none', 6000);
    }

    function qr(t) {
      if (!canTimbra(t)) return toast('Timbratura già registrata o non consentita', 1);
      beep(0);
      $('#scanbox').style.display = 'block';
      $('#scanlab').textContent = 'Stai timbrando: ' + T[t];
      scan = new Html5Qrcode('reader');
      let busy = 0;
      scan.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 220 },
        async txt => {
          if (busy) return;
          busy = 1;
          stopScan();
          $('#scanbox').style.display = 'none';
          try { await timbra(t, 'QR', null, null, txt); } catch (e) {}
        },
        () => {}
      ).catch(() => toast('Fotocamera non disponibile: controlla i permessi', 1));
    }

    function gps(t) {
      if (!canTimbra(t)) return toast('Timbratura già registrata o non consentita', 1);
      if (TIMBRA_LOCK) return;
      beep(0);
      if (!navigator.geolocation) return toast('GPS non supportato', 1);
      toast('Rilevo la posizione per: ' + T[t] + '…');
      navigator.geolocation.getCurrentPosition(
        async p => {
          try { await timbra(t, 'GPS', p.coords.latitude, p.coords.longitude, null); } catch (e) {}
        },
        () => toast('Posizione non disponibile: abilita il GPS', 1),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    }

    async function permesso() {
      if (!$('#ld').value || !$('#la').value) return toast('Inserisci le date', 1);
      const st = await rpc('lt_permesso', {
        p_tok: tok,
        p_tip: $('#lt').value,
        p_dal: new Date($('#ld').value).toISOString(),
        p_al: new Date($('#la').value).toISOString(),
        p_note: $('#ln').value
      });
      toast('Richiesta inviata');
      opView(st);
    }

    // =========================================================================

    function setOggiFilt(cat) {
      OGGI_FILT = (OGGI_FILT === cat) ? 'all' : cat;
      go('oggi');
    }

    async function tOggi() {
      const a = new Date(day + 'T00:00'), b = new Date(a.getTime() + 864e5);
      const [o, e, pm, tu] = await Promise.all([
        SB.from('lt_operatori').select('id,codice,nome').eq('attivo', true).order('nome'),
        SB.from('lt_timbrature').select('*').gte('orario', a.toISOString()).lt('orario', b.toISOString()).order('orario'),
        SB.from('lt_permessi').select('operatore_id,tipologia').eq('stato', 'Approvata').lt('dal', b.toISOString()).gt('al', a.toISOString()),
        SB.from('lt_turni').select('*').eq('giorno', day)
      ]);
      OPS = o.data || [];
      const ev = EV = e.data || [], P = pm.data || [], U = tu.data || [];
      const n = { pre: 0, pau: 0, usc: 0, ass: 0, giu: 0, rip: 0 };

      const items = OPS.map(p => {
        const x = ev.filter(y => y.operatore_id === p.id);
        const l = x[x.length - 1];
        const pe = P.find(y => y.operatore_id === p.id);
        const tn = U.find(y => y.operatore_id === p.id);
        let k, c, cat;
        if (l) {
          if (l.tipo === 'INIZIO_PAUSA') { k = 'p-wa'; c = '🟡 In pausa'; n.pau++; cat = 'pau'; }
          else if (l.tipo === 'USCITA') { k = 'p-no'; c = '🔴 Uscito'; n.usc++; cat = 'pre'; }
          else { k = 'p-ok'; c = '🟢 In servizio'; n.pre++; cat = 'pre'; }
        } else if (pe) {
          k = 'p-no'; c = '📝 Assente giustificato (' + esc(pe.tipologia) + ')'; n.giu++; cat = 'giu';
        } else if (tn && tn.riposo) {
          k = 'p-no'; c = '😴 Riposo'; n.rip++; cat = 'giu';
        } else {
          k = 'p-er'; c = '⛔ ASSENTE'; n.ass++; cat = 'ass';
        }
        const isPresente = !!l;
        const justifyBtn = (cat === 'ass')
          ? `<button class="sm wa" onclick="quickJustify('${p.id}')" title="Giustifica assenza del ${formatD(day)}">✓ Giustifica</button> `
          : '';

        const html = `
          <tr>
            <td>
              <b>${esc(p.nome)}</b>
              <div class="mu">${esc(p.codice)}${tn && !tn.riposo ? ' · turno ' + tn.inizio.slice(0, 5) + '–' + tn.fine.slice(0, 5) : ''}</div>
            </td>
            <td><span class="pill ${k}">${c}</span></td>
            <td>
              ${x.map(y => {
                const gpsIcon = y.lat != null
                  ? ` <a href="https://maps.google.com/?q=${y.lat},${y.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Apri posizione su Google Maps">📍</a>`
                  : '';
                return `<span class="ev mu" title="${y.metodo}" onclick="editT('${y.id}')">${T[y.tipo]} <b style="color:var(--tx)">${hm(y.orario)}</b>${gpsIcon} ✎</span>`;
              }).join('')}
            </td>
            <td style="white-space:nowrap;text-align:right">
              ${justifyBtn}
              <button class="sm s" onclick="addT('${p.id}')" title="Aggiungi timbratura">➕</button>
            </td>
          </tr>`;
        return { cat, isPresente, html };
      });

      const filtered = items.filter(it => {
        if (OGGI_FILT === 'all') return true;
        if (OGGI_FILT === 'pre') return it.isPresente;
        return it.cat === OGGI_FILT;
      });

      const labels = {
        all: 'Tutti gli operatori',
        pre: '🟢 Elenco Presenti (in servizio, in pausa o usciti)',
        pau: '🟡 Elenco In pausa',
        ass: '🔴 Elenco Assenti',
        giu: '🗓️ Elenco Giustificati / Riposo'
      };
      const bx = (v, t, c, cls, cat) => `
        <div class="card ${cls} stat-box ${OGGI_FILT === cat ? 'active' : ''}" onclick="setOggiFilt('${cat}')" title="Clicca per filtrare l'elenco" style="margin:0;text-align:center;padding:12px">
          <div style="font-size:26px;font-weight:800;color:${c}">${v}</div>
          <div class="mu">${t}</div>
        </div>`;

      return `
        <div class="card card-ac">
          <h2>📊 Presenze giornaliere</h2>
          <div class="row">
            <input type="date" value="${day}" onchange="day=this.value;go('oggi')">
            <button class="s" onclick="day=dkey(new Date());go('oggi')">📅 Oggi</button>

    function parseTurnoDate(dayStr, timeStr, refDate) {
      const [hh, mm] = timeStr.slice(0, 5).split(':').map(Number);
      const d = new Date(dayStr + 'T00:00:00');
      d.setHours(hh, mm, 0, 0);
      if (refDate && (d - refDate) < -6 * 36e5) d.setDate(d.getDate() + 1);
      return d;
    }

    function getEasterMD(y) {
      const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4,
            f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
            i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
            mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(y, mo - 1, da);
    }

    function isFestaIT(y, mo, d) {
      const mmdd = String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      if (['01-01', '01-06', '04-25', '05-01', '06-02', '08-15', '11-01', '12-08', '12-25', '12-26'].includes(mmdd)) return true;
      const pasquetta = getEasterMD(y);
      pasquetta.setDate(pasquetta.getDate() + 1);
      return pasquetta.getMonth() + 1 === mo && pasquetta.getDate() === d;
    }

    const gmAuto = m => {
      const [y, mo] = m.split('-').map(Number), n = new Date(y, mo, 0).getDate();
      let c = 0;
      for (let d = 1; d <= n; d++) {
        const w = new Date(y, mo - 1, d).getDay();
        if (w > 0 && w < 6 && !isFestaIT(y, mo, d)) c++;
      }
      return c;
    };

    function computeLeaveHours(startIso, endIso) {
      const start = new Date(startIso);
      const end = new Date(endIso);
      const diffHours = (end - start) / 3600000;
      if (diffHours <= 0) return 0;
      if (diffHours <= 8) return Math.round(diffHours * 100) / 100;
      let workDays = 0;
      const cur = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      const last = new Date(end.getFullYear(), end.getMonth(), end.getDate());
      while (cur <= last) {
        const dow = cur.getDay();
        if (dow >= 1 && dow <= 5 && !isFestaIT(cur.getFullYear(), cur.getMonth() + 1, cur.getDate())) workDays++;
        cur.setDate(cur.getDate() + 1);
      }
      return workDays > 0 ? workDays * 8 : Math.round(diffHours * 100) / 100;
    }

    function calc(ev, turniOp) {
      const tMap = {};
      (turniOp || []).forEach(t => { tMap[t.giorno] = t; });
      const dayEvs = {};
      for (const e of ev) {
        const k = dkey(e.orario);
        if (!dayEvs[k]) dayEvs[k] = [];
        dayEvs[k].push(e);
      }
      let o = 0, s = 0;
      const det = Object.keys(dayEvs).sort().map(k => {
        const list = dayEvs[k];
        const tn = tMap[k];
        const dtObj = new Date(k + 'T12:00');
        const w = dtObj.getDay();
        const we = w === 0 || w === 6 || isFestaIT(dtObj.getFullYear(), dtObj.getMonth() + 1, dtObj.getDate());
        const causali = [];
        let en = null, ip = null, fp = null, us = null, pz = false;
        for (const e of list) {
          const t = new Date(e.orario);
          if (e.tipo === 'ENTRATA' && !en) en = t;
          if (e.tipo === 'INIZIO_PAUSA') { pz = true; if (!ip) ip = t; }
          if (e.tipo === 'FINE_PAUSA') { pz = true; fp = t; }
          if (e.tipo === 'USCITA') us = t;
        }

        let effIn = en, effOut = us;
        const TOL_MS = 15 * 60000;
        let turnoLabel = '–';
        if (tn) {
          if (tn.riposo) {
            turnoLabel = 'Riposo';
            causali.push('Lavoro in giorno di riposo');
          } else if (tn.inizio && tn.fine) {
            turnoLabel = tn.inizio.slice(0, 5) + '–' + tn.fine.slice(0, 5);
            const schedIn = parseTurnoDate(k, tn.inizio);
            const schedOut = parseTurnoDate(k, tn.fine, schedIn);
            if (en && Math.abs(en - schedIn) <= TOL_MS) {
              effIn = schedIn;
              if (en.getTime() !== schedIn.getTime()) causali.push(`Ingresso in tolleranza (${hm(en)}→${tn.inizio.slice(0, 5)})`);
            } else if (en && en < schedIn) {
              causali.push(`Anticipo ingresso (${hm(en)})`);
            } else if (en && en > schedIn) {
              causali.push(`Ritardo ingresso (${hm(en)})`);
            }
            if (us && Math.abs(us - schedOut) <= TOL_MS) {
              effOut = schedOut;
              if (us.getTime() !== schedOut.getTime()) causali.push(`Uscita in tolleranza (${hm(us)}→${tn.fine.slice(0, 5)})`);
            } else if (us && us > schedOut) {
              causali.push(`Prolungamento uscita (${hm(us)})`);
            }
          }
        } else {
          causali.push('Nessun turno assegnato');
        }

        let rawHours = 0, st = null, firstUsed = false;
        const lastExitIdx = list.map(x => x.tipo).lastIndexOf('USCITA');
        list.forEach((e, idx) => {
          let t = new Date(e.orario);
          if (e.tipo === 'ENTRATA' && !firstUsed && effIn) { t = effIn; firstUsed = true; }
          if (e.tipo === 'USCITA' && idx === lastExitIdx && effOut) { t = effOut; }
          if (e.tipo === 'ENTRATA' || e.tipo === 'FINE_PAUSA') {
            st = t;
          } else if (st) {
            const diff = (t - st) / 36e5;
            if (diff > 0 && diff < 20) rawHours += diff;
            st = null;
          }
        });

        // REGOLA PAUSA AUTOMATICA: se non timbra la pausa e supera 8:30 ore (8.5h) dall'inizio lavoro all'uscita, scala 1h
        let d = 0;
        if (!pz && rawHours > 8.5) {
          rawHours -= 1;
          d = 1;
          causali.push('Pausa -1h automatica (>8:30h)');
        }

        let ord = 0, rawStrMin = 0;
        if (tn && !tn.riposo && tn.inizio && tn.fine) {
          const schedIn = parseTurnoDate(k, tn.inizio);
          const schedOut = parseTurnoDate(k, tn.fine, schedIn);
          let pauseH = 0;
          if (ip && fp && fp > ip) pauseH = (fp - ip) / 36e5;
          else if (d) pauseH = 1;
          const schedNetH = Math.max(0, ((schedOut - schedIn) / 36e5) - pauseH);
          ord = Math.min(schedNetH, rawHours);
          rawStrMin = Math.max(0, Math.round((rawHours - schedNetH) * 60));
        } else if ((tn && tn.riposo) || we) {
          ord = 0;
          rawStrMin = Math.max(0, Math.round(rawHours * 60));
          if (we && (!tn || !tn.riposo)) causali.push('Straordinario festivo/weekend');
        } else {
          ord = Math.min(8, rawHours);
          rawStrMin = Math.max(0, Math.round((rawHours - 8) * 60));
        }

        const strBlocks = Math.floor((rawStrMin + 0.001) / 30);
        const str = strBlocks * 0.5;
        if (rawStrMin > 0 && str === 0) {
          causali.push(`Extra ${rawStrMin}m (<30m, non maturato)`);
        } else if (str > 0) {
          causali.push(`Straordinario maturato: ${str * 60}m`);
        }

        o += ord;
        s += str;
        return { k, w, en, ip, fp, us, pz, d, h: rawHours, ord, str, turnoLabel, causali: causali.join(' · ') };
      });
      return { g: det.length, o, s, det };
    }

    let RC = { key: null, ops: [], ev: [], tu: [], pm: [] }, RFILT = 'ALL', RROWS = [], RLEAVES = [];
    let RMODE = 'month';
    let RFROM = mon + '-01', RTO = dkey(new Date());
    const r2 = n => Math.round(n * 100) / 100;
    const eur = n => n == null ? '–' : '€ ' + n.toFixed(2).replace('.', ',');
    const fh = n => n.toFixed(2).replace('.', ',');

    function setRepMode(m) {
      RMODE = m;
      if (m === 'range') {
        if (!RFROM) RFROM = mon + '-01';
        if (!RTO) RTO = dkey(new Date());
      }
      go('rep');
    }

    async function tRep() {
      let a, b, dStart, dEnd, refMon;
      if (RMODE === 'range') {
        if (!RFROM) RFROM = mon + '-01';
        if (!RTO) RTO = RFROM;
        if (RTO < RFROM) RTO = RFROM;
        dStart = RFROM;
        dEnd = RTO;
        a = new Date(dStart + 'T00:00:00');
        b = new Date(dEnd + 'T00:00:00');
        b.setDate(b.getDate() + 1);
        refMon = dStart.slice(0, 7);
      } else {
        a = new Date(mon + '-01T00:00:00');
        b = new Date(a.getFullYear(), a.getMonth() + 1, 1);
        dStart = mon + '-01';
        dEnd = dkey(new Date(a.getFullYear(), a.getMonth() + 1, 0));
        refMon = mon;
      }

      const cacheKey = RMODE + ':' + dStart + ':' + dEnd;
      if (RC.key !== cacheKey) {
        const [o, ev, tu, pm] = await Promise.all([
          SB.from('lt_operatori').select('id,codice,nome,sede,netto').order('nome'),
          fetchAll(() => SB.from('lt_timbrature').select('operatore_id,tipo,orario').gte('orario', a.toISOString()).lt('orario', b.toISOString()).order('orario')),
          fetchAll(() => SB.from('lt_turni').select('operatore_id,giorno,inizio,fine,riposo').gte('giorno', dStart).lte('giorno', dEnd)),
          fetchAll(() => SB.from('lt_permessi').select('*').lt('dal', b.toISOString()).gt('al', a.toISOString()).order('dal', { ascending: false }))
        ]);
        RC = { key: cacheKey, ops: o.data || [], ev, tu, pm };
      }

      const sedi = [...new Set(RC.ops.map(p => (p.sede || '').trim()).filter(Boolean))].sort();
      if (RFILT !== 'ALL' && !RFILT.startsWith('SEDE:') && !RFILT.startsWith('OP:')) RFILT = 'ALL';

      const filteredOps = RC.ops.filter(p => {
        if (RFILT === 'ALL') return true;
        if (RFILT.startsWith('SEDE:')) return (p.sede || '').trim() === RFILT.slice(5);
        if (RFILT.startsWith('OP:')) return p.id === RFILT.slice(3);
        return true;
      });

      const allowedIds = new Set(filteredOps.map(p => p.id));
      RLEAVES = RC.pm.filter(p => allowedIds.has(p.operatore_id)).map(p => {
        const op = RC.ops.find(x => x.id === p.operatore_id);
        const hrs = computeLeaveHours(p.dal, p.al);
        return {
          codice: op ? op.codice : '-',
          nome: op ? op.nome : '-',
          sede: op ? (op.sede || '-') : '-',
          tipologia: p.tipologia,
          dal: dtFull(p.dal),
          al: dtFull(p.al),
          ore: hrs,
          stato: p.stato,
          note: p.note || ''
        };
      });

      const gm = gmAuto(refMon);
      RROWS = filteredOps.map(p => {
        const c = calc(RC.ev.filter(x => x.operatore_id === p.id), RC.tu.filter(x => x.operatore_id === p.id));
        const opPm = RC.pm.filter(x => x.operatore_id === p.id && x.stato === 'Approvata');
        let oreFerie = 0, orePermessi = 0;
        opPm.forEach(x => {
          const h = computeLeaveHours(x.dal, x.al);
          if (String(x.tipologia || '').toLowerCase().includes('ferie')) oreFerie += h;
          else orePermessi += h;
        });
        const tar = p.netto != null ? (p.netto / gm) / 8 : null;
        return { p, ...c, oreFerie: r2(oreFerie), orePermessi: r2(orePermessi), tar, imp: tar != null ? r2(tar * c.s) : null };
      });

      const tot = RROWS.reduce((a, r) => a + (r.imp || 0), 0);
      const perLabel = RMODE === 'range' ? `dal ${formatD(dStart)} al ${formatD(dEnd)}` : `mese ${mon}`;

      return `
        <div class="card card-ac">
          <h2>📈 Report presenze, straordinari e ferie</h2>
          <div class="row">
            <div>
              <label class="mu">Tipo periodo</label>
              <select onchange="setRepMode(this.value)">
                <option value="month" ${RMODE === 'month' ? 'selected' : ''}>📅 Tutto il mese</option>
                <option value="range" ${RMODE === 'range' ? 'selected' : ''}>📆 Periodo personalizzato (Dal – Al)</option>
              </select>
            </div>
            ${RMODE === 'month'
              ? `<div><label class="mu">Mese</label><input type="month" value="${mon}" onchange="mon=this.value;go('rep')"></div>`
              : `<div><label class="mu">Dal</label><input type="date" value="${dStart}" onchange="RFROM=this.value;go('rep')"></div>
                 <div><label class="mu">Al</label><input type="date" value="${dEnd}" onchange="RTO=this.value;go('rep')"></div>`}
            <div>
              <label class="mu">Gg lavorativi (${refMon} · cal. IT)</label>
              <input type="text" value="${gm} gg" readonly tabindex="-1">
            </div>
            <div>
              <label class="mu">Filtro Operatori / Sede</label>
              <select onchange="RFILT=this.value;go('rep')">
                <option value="ALL" ${RFILT === 'ALL' ? 'selected' : ''}>👥 Tutti gli operatori (${RC.ops.length})</option>
                ${sedi.length ? `<optgroup label="Filtra per Sede">${sedi.map(s => `<option value="SEDE:${esc(s)}" ${RFILT === 'SEDE:' + s ? 'selected' : ''}>📍 Sede: ${esc(s)}</option>`).join('')}</optgroup>` : ''}
                <optgroup label="Singolo Operatore">${RC.ops.map(p => `<option value="OP:${p.id}" ${RFILT === 'OP:' + p.id ? 'selected' : ''}>👤 ${esc(p.nome)} (${esc(p.sede || '–')})</option>`).join('')}</optgroup>
              </select>
            </div>
          </div>

          <div class="row">
            <button class="bl" onclick="exportExcel3Sheets()">📊 Esporta Excel (.xlsx) 3 Fogli</button>
            <button class="ok" onclick="csvRiep()">⬇️ CSV Riepilogo</button>
            <button class="s" onclick="csvDett()">⬇️ CSV Dettaglio Giornaliero</button>
          </div>

          <p class="mu">Periodo: <b>${esc(perLabel)}</b> · Regola pausa: se non timbrata e il turno supera <b>8:30 ore</b>, viene scalata 1h automatica. Clicca su un operatore per il dettaglio giornaliero.</p>

          <div class="wrap">
            <table>
              <tr>
                <th>Operatore</th>
                <th>Sede</th>
                <th>Giorni</th>
                <th>Ordinarie</th>
                <th>Straord.</th>
                <th>Ferie / Perm.</th>
                <th>Netto</th>
                <th>€/ora</th>
                <th>Importo straord.</th>
              </tr>
              ${RROWS.map(r => `
                <tr onclick="repDett('${r.p.id}')" style="cursor:pointer" title="Clicca per dettaglio giornaliero e causali">
                  <td><b style="color:var(--ac2)">${esc(r.p.nome)}</b><div class="mu">${esc(r.p.codice)}</div></td>
                  <td>${esc(r.p.sede || '–')}</td>
                  <td>${r.g}</td>
                  <td>${fh(r.o)} h</td>
                  <td><b>${fh(r.s)} h</b></td>
                  <td class="mu">${fh(r.oreFerie)}h F / ${fh(r.orePermessi)}h P</td>
                  <td>${r.p.netto != null ? eur(+r.p.netto) : '<span class="pill p-er">manca</span>'}</td>
                  <td>${r.tar != null ? eur(r.tar) : '–'}</td>
                  <td><b>${eur(r.imp)}</b></td>
                </tr>`).join('')}
            </table>
          </div>
          <p style="text-align:right"><b>Totale straordinari: ${eur(tot)}</b></p>
        </div>`;
    }

    function repDett(id) {
      const r = RROWS.find(x => x.p.id === id);
      if (!r) return;
      const N = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
      const perLabel = RMODE === 'range' ? `Dal ${formatD(RFROM)} al ${formatD(RTO)}` : `Periodo ${mon}`;
      const dlg = $('#dlg');
      dlg.style.maxWidth = '880px';
      dlg.innerHTML = `
        <h2>📋 ${esc(r.p.nome)}</h2>
        <div class="mu" style="margin-bottom:10px">${esc(perLabel)} · ${r.g} giorni · Ordinarie ${fh(r.o)} h · Straordinario <b>${fh(r.s)} h</b></div>
        <div class="wrap">
          <table>
            <tr><th>Giorno</th><th>Turno</th><th>Ingresso</th><th>Pausa</th><th>Fine pausa</th><th>Uscita</th><th>Straord.</th><th>Causali / Note</th></tr>
            ${r.det.length ? r.det.map(d => `
              <tr>
                <td><b>${N[d.w]} ${formatD(d.k).slice(0, 5)}</b></td>
                <td><span class="pill p-no">${esc(d.turnoLabel)}</span></td>
                <td>${d.en ? hm(d.en) : '–'}</td>
                <td>${d.ip ? hm(d.ip) : (d.d ? '<span class="mu">(-1h auto)</span>' : '–')}</td>
                <td>${d.fp ? hm(d.fp) : '–'}</td>
                <td>${d.us ? hm(d.us) : '–'}</td>
                <td><b>${fh(d.str)} h</b></td>
                <td class="mu">${esc(d.causali || '–')}</td>
              </tr>`).join('') : '<tr><td colspan="8" class="mu">Nessuna timbratura nel periodo.</td></tr>'}
          </table>
        </div>
        <button class="s" style="margin-top:12px" onclick="$('#dlg').style.maxWidth='';$('#dlg').close()">Chiudi</button>`;
      dlg.showModal();
    }

    function exportExcel3Sheets() {
      if (typeof XLSX === 'undefined') return toast('Libreria Excel non caricata', 1);
      const tag = RMODE === 'range' ? `${RFROM}_${RTO}` : mon;
      const N = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
      const wb = XLSX.utils.book_new();

      // Foglio 1: Riepilogo Operatori
      const s1 = [[
        'Codice', 'Operatore', 'Sede', 'Giorni Lavorati', 'Ore Ordinarie', 'Ore Straordinario',
        'Ore Ferie Approvate', 'Ore Permessi/ROL Approvati', 'Stipendio Netto (€)', 'Tariffa Oraria (€)', 'Importo Straordinario (€)'
      ]];
      RROWS.forEach(r => {
        s1.push([
          r.p.codice, r.p.nome, r.p.sede || '', r.g, r2(r.o), r2(r.s),
          r.oreFerie, r.orePermessi, r.p.netto != null ? +r.p.netto : '', r.tar != null ? r2(r.tar) : '', r.imp != null ? r.imp : ''
        ]);
      });
      const ws1 = XLSX.utils.aoa_to_sheet(s1);
      ws1['!cols'] = [{ wch: 14 }, { wch: 24 }, { wch: 16 }, { wch: 15 }, { wch: 14 }, { wch: 16 }, { wch: 18 }, { wch: 22 }, { wch: 18 }, { wch: 18 }, { wch: 22 }];
      XLSX.utils.book_append_sheet(wb, ws1, 'Riepilogo_Operatori');

      // Foglio 2: Ferie e Permessi
      const s2 = [['Codice', 'Operatore', 'Sede', 'Tipologia', 'Dal', 'Al', 'Ore Calcolate', 'Stato', 'Note']];
      RLEAVES.forEach(l => {
        s2.push([l.codice, l.nome, l.sede, l.tipologia, l.dal, l.al, l.ore, l.stato, l.note]);
      });
      const ws2 = XLSX.utils.aoa_to_sheet(s2);
      ws2['!cols'] = [{ wch: 14 }, { wch: 24 }, { wch: 16 }, { wch: 20 }, { wch: 18 }, { wch: 18 }, { wch: 14 }, { wch: 14 }, { wch: 30 }];
      XLSX.utils.book_append_sheet(wb, ws2, 'Ferie_e_Permessi');

      // Foglio 3: Dettaglio Giornaliero
      const s3 = [[
        'Data', 'Giorno', 'Codice', 'Operatore', 'Sede', 'Turno Assegnato',
        'Entrata', 'Uscita Pausa', 'Rientro Pausa', 'Uscita', 'Pausa Automatica (h)',
        'Ore Nette', 'Ore Ordinarie', 'Ore Straordinario', 'Causali / Note'
      ]];
      RROWS.forEach(r => {
        r.det.forEach(d => {
          s3.push([
            formatD(d.k), N[d.w], r.p.codice, r.p.nome, r.p.sede || '', d.turnoLabel,
            d.en ? hm(d.en) : '-', d.ip ? hm(d.ip) : '-', d.fp ? hm(d.fp) : '-', d.us ? hm(d.us) : '-',
            d.d, r2(d.h), r2(d.ord), r2(d.str), d.causali
          ]);
        });
      });
      const ws3 = XLSX.utils.aoa_to_sheet(s3);
      ws3['!cols'] = [{ wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 24 }, { wch: 14 }, { wch: 15 }, { wch: 10 }, { wch: 13 }, { wch: 13 }, { wch: 10 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 16 }, { wch: 36 }];
      XLSX.utils.book_append_sheet(wb, ws3, 'Dettaglio_Giornaliero');

      XLSX.writeFile(wb, 'LeoTrack_Report_' + tag + '.xlsx');
      toast('Report Excel (.xlsx) scaricato con 3 fogli!');
    }

    function dl(nome, L) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['\ufeff' + L.join('\n')], { type: 'text/csv' }));
      a.download = nome;
      a.click();
    }

      dl('riepilogo_' + tag + '.csv', ['Codice;Operatore;Sede;Giorni lavorati;Ore ordinarie;Ore straordinario;Ore Ferie;Ore Permessi;Netto;Euro per ora;Importo straordinario'].concat(
        RROWS.map(r => [r.p.codice, r.p.nome, r.p.sede || '', r.g, fh(r.o), fh(r.s), fh(r.oreFerie), fh(r.orePermessi), r.p.netto != null ? fh(+r.p.netto) : '', r.tar != null ? fh(r.tar) : '', r.imp != null ? fh(r.imp) : ''].join(';'))
      ));

    function csvDett() {
      const tag = RMODE === 'range' ? `${RFROM}_${RTO}` : mon;
      const N = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
      const L = ['Data;Giorno;Codice;Operatore;Sede;Turno;Entrata;Uscita;Pausa timbrata;Pausa scalata (h);Ore nette;Ordinarie;Straordinario;Causali'];
      RROWS.forEach(r => r.det.forEach(d => L.push([formatD(d.k), N[d.w], r.p.codice, r.p.nome, r.p.sede || '', d.turnoLabel, d.en ? hm(d.en) : '', d.us ? hm(d.us) : '', d.pz ? 'sì' : 'no', d.d, fh(d.h), fh(d.ord), fh(d.str), d.causali].join(';'))));
      dl('dettaglio_' + tag + '.csv', L);
    }

    async function tSede() {
      return `
        <div class="card card-ac">
          <h2>📍 Sede per timbratura GPS</h2>
          <p class="mu">Gli operatori con «GPS in sede» timbrano entro 50 o 100 m da questo punto (lo scegli per ogni operatore); «GPS ovunque» non ha limiti. Il controllo è fatto dal server.</p>
          <div class="row">
            <input id="la1" placeholder="Latitudine" value="${CFG.hq_lat ?? ''}">
            <input id="lo1" placeholder="Longitudine" value="${CFG.hq_lng ?? ''}">
          </div>
          <div class="row">
            <button class="s" onclick="detect()">🎯 Rileva la mia posizione</button>
            <button class="ok" onclick="saveSede()">💾 Salva</button>
          </div>
        </div>`;
    }

    function detect() {
      navigator.geolocation.getCurrentPosition(
        p => {
          $('#la1').value = p.coords.latitude.toFixed(6);
          $('#lo1').value = p.coords.longitude.toFixed(6);
        },
        () => toast('Posizione non disponibile', 1),
        { enableHighAccuracy: true }
      );
    }

    async function saveSede() {
      const la = parseFloat($('#la1').value), lo = parseFloat($('#lo1').value), ra = CFG.raggio;
      if (isNaN(la) || isNaN(lo)) return toast('Coordinate non valide', 1);
      const { error } = await SB.from('lt_config').update({ hq_lat: la, hq_lng: lo, raggio: ra }).eq('id', 1);
      if (error) return toast(error.message, 1);
      CFG = { ...CFG, hq_lat: la, hq_lng: lo, raggio: ra };
      toast('Sede salvata');
    }

    async function pendRefresh() {
      if (!ad) return;
      const { count, error } = await SB.from('lt_permessi').select('id', { count: 'exact', head: true }).eq('stato', 'In attesa');
      if (error) return;
      const old = PEND;
      PEND = count || 0;
      if (old !== null && PEND > old) {
        beep(2);
        toast('Nuova richiesta di permesso: ' + PEND + ' da gestire');
      }
      drawPend();
    }
    setInterval(() => { if (ad && (location.hash === '#admin' || deviceMode === 'admin')) pendRefresh(); }, 45000);

    // =========================================================================
    // TAB 6: GESTIONE TURNI SETTIMANALI
    // =========================================================================
    const GS = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
    const addD = (d, n) => { d = new Date(d + 'T12:00'); d.setDate(d.getDate() + n); return dkey(d); };
    const lun = d => { const x = new Date(d + 'T12:00'); return addD(d, -((x.getDay() + 6) % 7)); };
    let wk = lun(dkey(new Date())), TU = [];

    async function tTurni() {
      const [o, t] = await Promise.all([
        SB.from('lt_operatori').select('id,nome').eq('attivo', true).order('nome'),
        SB.from('lt_turni').select('*').gte('giorno', wk).lte('giorno', addD(wk, 6))
      ]);
      OPS = o.data || [];
      TU = t.data || [];
      const days = [0, 1, 2, 3, 4, 5, 6].map(i => addD(wk, i));
      const ck = 'style="width:auto;margin:0 5px 0 0"', lb = 'class="mu" style="flex:0 0 auto;min-width:0"';

      return `
        <div class="card card-ac">
          <h2>🗓️ Inserimento rapido dei turni</h2>
          <div class="row">
            <div><label class="mu">Da (lunedì)</label><input id="ti" type="date" value="${wk}"></div>
            <div><label class="mu">Per quante settimane</label>
              <select id="tw">
                <option value="1">1</option>
                <option value="4" selected>4</option>
                <option value="8">8</option>
                <option value="12">12</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div><label class="mu">Inizio</label><input id="ts" type="time" value="08:00"></div>
            <div><label class="mu">Fine</label><input id="te" type="time" value="16:00"></div>
          </div>
          <div class="row" style="gap:8px">${GS.map((g, i) => `<label ${lb}><input type="checkbox" class="tg" value="${i}" ${i < 5 ? 'checked' : ''} ${ck}>${g}</label>`).join('')}</div>
          <label class="mu" style="display:block"><input type="checkbox" id="tr" checked ${ck}>Segna «Riposo» negli altri giorni</label>
          <label class="mu" style="display:block;margin:8px 0"><input type="checkbox" checked onchange="document.querySelectorAll('.to').forEach(c=>c.checked=this.checked)" ${ck}><b>Tutti gli operatori</b></label>
          <div class="row" style="gap:6px 14px">${OPS.map(p => `<label ${lb}><input type="checkbox" class="to" value="${p.id}" checked ${ck}>${esc(p.nome)}</label>`).join('')}</div>
          <button class="ok" onclick="applicaTurni()">✓ Applica i turni</button>
        </div>

        <div class="card">
          <div class="row" style="align-items:center;flex-wrap:nowrap">
            <button class="s sm" onclick="wk=addD(wk,-7);go('turni')">◀</button>
            <b style="text-align:center">Settimana dal ${formatD(wk)}</b>
            <button class="s sm" onclick="wk=addD(wk,7);go('turni')">▶</button>
          </div>
          <p class="mu">Tocca una casella per cambiare il turno di quel giorno.</p>
          <div class="wrap">
            <table>
              <tr><th>Operatore</th>${days.map((d, i) => `<th>${GS[i]} ${d.slice(8)}</th>`).join('')}</tr>
              ${OPS.map(p => `
                <tr>
                  <td><b>${esc(p.nome)}</b></td>
                  ${days.map(d => {
                    const x = TU.find(y => y.operatore_id === p.id && y.giorno === d);
                    return `<td onclick="editTurno('${p.id}','${d}')" style="cursor:pointer;white-space:nowrap">${x ? (x.riposo ? '<span class="pill p-no">😴 Riposo</span>' : x.inizio.slice(0, 5) + '–' + x.fine.slice(0, 5)) : '<span class="mu">➕</span>'}</td>`;
                  }).join('')}
                </tr>`).join('')}
            </table>
          </div>
        </div>`;
    }

    async function applicaTurni() {
      const ops = [...document.querySelectorAll('.to:checked')].map(c => c.value);
      const gd = [...document.querySelectorAll('.tg:checked')].map(c => +c.value);
      const w = +$('#tw').value, st = lun($('#ti').value), ini = $('#ts').value, fin = $('#te').value, rip = $('#tr').checked;
      if (!ops.length) return toast('Seleziona almeno un operatore', 1);
      if (!gd.length && !rip) return toast('Seleziona almeno un giorno', 1);

      const rows = [];
      for (const op of ops) {
        for (let i = 0; i < w * 7; i++) {
          const g = addD(st, i);
          if (gd.includes(i % 7)) rows.push({ operatore_id: op, giorno: g, inizio: ini, fine: fin, riposo: false });
          else if (rip) rows.push({ operatore_id: op, giorno: g, inizio: null, fine: null, riposo: true });
        }
      }
      if (!confirm('Applicare ' + rows.length + ' turni per ' + w + ' settimane dal ' + formatD(st) + '? Quelli già presenti verranno sostituiti.')) return;
      for (let i = 0; i < rows.length; i += 500) {
        const { error } = await SB.from('lt_turni').upsert(rows.slice(i, i + 500), { onConflict: 'operatore_id,giorno' });
        if (error) return toast(error.message, 1);
      }
      wk = st;
      toast('Turni inseriti');
      go('turni');
    }

    function editTurno(op, g) {
      const x = TU.find(y => y.operatore_id === op && y.giorno === g), p = OPS.find(o => o.id === op);
      $('#dlg').style.maxWidth = '420px';
      $('#dlg').innerHTML = `
        <h2>🗓️ Turno del ${formatD(g)}</h2>
        <div class="mu">${esc(p ? p.nome : '')}</div>
        <div class="row">
          <input id="xs" type="time" value="${x && x.inizio ? x.inizio.slice(0, 5) : '08:00'}">
          <input id="xe" type="time" value="${x && x.fine ? x.fine.slice(0, 5) : '16:00'}">
        </div>
        <div class="row">
          <button class="s" onclick="saveTurno('${op}','${g}',1)">😴 Riposo</button>
          <button class="ok" onclick="saveTurno('${op}','${g}',0)">💾 Salva turno</button>
        </div>
        <div class="row">
          <button class="er" onclick="delTurno('${op}','${g}')">🗑️ Elimina</button>
          <button class="s" onclick="$('#dlg').close()">Chiudi</button>
        </div>`;
      $('#dlg').showModal();
    }

    async function saveTurno(op, g, r) {
      const { error } = await SB.from('lt_turni').upsert({
        operatore_id: op,
        giorno: g,
        inizio: r ? null : $('#xs').value,
        fine: r ? null : $('#xe').value,
        riposo: !!r
      }, { onConflict: 'operatore_id,giorno' });
      if (error) return toast(error.message, 1);
      $('#dlg').close();
      go('turni');
    }

    async function delTurno(op, g) {
      const { error } = await SB.from('lt_turni').delete().eq('operatore_id', op).eq('giorno', g);
      if (error) return toast(error.message, 1);
      $('#dlg').close();
      go('turni');
    }

    // =========================================================================
    // ROUTER: SUPPORTO SIA HASH (#admin / #kiosk) SIA BLOCCO DISPOSITIVO
    // =========================================================================
    function route() {
      clearInterval(tm);
      stopScan();
      const h = location.hash.slice(1);
      const target = h || deviceMode || 'operator';
      if (target === 'admin') adminView();
      else if (target === 'kiosk') kioskView();
      else opView();
    }

    addEventListener('hashchange', route);
    route();
  </script>
</body>
</html>
